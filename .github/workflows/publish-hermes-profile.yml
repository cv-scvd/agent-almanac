name: Publish Hermes Profile

# Builds the Hermes profile distribution (companion #78) and pushes it to
# pjt222/agent-almanac-hermes-profile — the ONE writer that repository has. Everything there is
# generated by `scripts/build-hermes-distribution.js`; a hand edit there is overwritten on the
# next release, and a foreign file there makes the regenerate step exit 2 and this job go red.
#
# WHY ON TAGS. The manifest's `version` mirrors package.json, so the distribution must be built
# from the checkout that version names — a build from `main` would stamp 1.9.1 on content newer
# than the 1.9.1 tag. Tag pushes run the workflow file AT THE TAGGED REF, so this protects tags
# cut at or after the commit that adds it, never one that already exists (release.yml, same
# limit). Hermes has no ref pinning: consumers clone the distribution's default branch, so HEAD
# there only ever moves here, on a release.
#
# WHAT `dry_run` DOES. Build, gate, clone the distribution repository, regenerate the checkout in
# place and print what changed — everything but the push. `default: true` is load-bearing: a
# boolean input with no default is `false`, so deleting that line makes an API dispatch that omits
# the input publish for real (release.yml carries the same note). The push arm is additionally
# gated on a tag ref, for the same reason as release.yml: a dispatch from a branch would put bytes
# on the distribution corresponding to no release marker.
#
# WHAT IS NOT RE-RUN. The five required checks already bound the commit the tag points at, and
# the generator's own gates run below. `npm test` is release.yml's concern; this job does not
# repeat the CLI suite.
#
# OPERATOR SETUP, three steps, none of which this file can do:
#   1. Create the public repository pjt222/agent-almanac-hermes-profile (empty, default branch
#      `main`). The first push here creates `main`.
#   2. Generate a keypair — `ssh-keygen -t ed25519 -N '' -C hermes-profile-deploy -f key` — and
#      add `key.pub` as a DEPLOY KEY with write access on THAT repository.
#   3. Add the private key as the secret HERMES_PROFILE_DEPLOY_KEY on THIS repository.
# Until step 3 lands, every run builds and gates, warns that no key is present, and pushes nothing.
# The `contents: read` token below cannot write to another repository, deliberately.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, gate and diff against the distribution repository, but do not push'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DIST_REPO: pjt222/agent-almanac-hermes-profile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Same check as release.yml, same reason: the tag is not the version. A distribution built
      # from a tag whose package.json says something else would carry the wrong `version`.
      - name: The tag must match the manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG="$(node -p 'require("./package.json").version')"
          if [ "v$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package.json $PKG"

      # Every build-gate, on a temp build from this checkout. Red here means this tree holds
      # something the distribution cannot carry — the job stops before touching the other repo.
      - name: Build and gate from this checkout
        run: node scripts/build-hermes-distribution.js --check

      - name: Is there a deploy key?
        id: key
        env:
          KEY: ${{ secrets.HERMES_PROFILE_DEPLOY_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HERMES_PROFILE_DEPLOY_KEY is not set — built and gated; nothing cloned, nothing pushed"
          fi

      # A full clone, not `--depth 1`: the history is one commit per release and a push from a
      # shallow clone is the kind of thing that works until it does not.
      - name: Clone the distribution repository
        if: steps.key.outputs.present == 'true'
        env:
          KEY: ${{ secrets.HERMES_PROFILE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone "git@github.com:${DIST_REPO}.git" "$RUNNER_TEMP/dist"

      # Replaces the five entries the generator owns and leaves `.git` alone. Exit 2 — and a red
      # job — if the checkout holds anything else: that repository is never hand-edited, and the
      # generator refuses to delete what it did not write.
      - name: Regenerate the checkout in place
        if: steps.key.outputs.present == 'true'
        run: node scripts/build-hermes-distribution.js --out "$RUNNER_TEMP/dist"

      - name: What changed
        if: steps.key.outputs.present == 'true'
        id: diff
        run: |
          cd "$RUNNER_TEMP/dist"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nothing to publish: the checkout already matches this build"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat | tail -25
          fi

      # The source commit goes in the commit message, never in an emitted file — the output is
      # deterministic so `--check --against` needs no exclusions.
      - name: Push
        if: >-
          steps.key.outputs.present == 'true' &&
          steps.diff.outputs.changed == 'true' &&
          (github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' &&
          !inputs.dry_run &&
          startsWith(github.ref, 'refs/tags/')))
        run: |
          cd "$RUNNER_TEMP/dist"
          git -c user.name='agent-almanac publish' -c user.email='noreply@github.com' \
            commit -q -m "Build from agent-almanac ${GITHUB_REF_NAME} (${GITHUB_SHA})" \
            -m "Generated by scripts/build-hermes-distribution.js in github.com/pjt222/agent-almanac. Do not edit by hand."
          git push origin HEAD:main
