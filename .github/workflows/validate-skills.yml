name: Validate Skills
on:
  push:
    branches: [main]
    paths: ['skills/**', 'i18n/**', 'agents/**', 'teams/**', 'guides/**', 'scripts/**', 'package.json', 'package-lock.json', '.github/workflows/validate-skills.yml']
  pull_request:
    paths: ['skills/**', 'i18n/**', 'agents/**', 'teams/**', 'guides/**', 'scripts/**', 'package.json', 'package-lock.json', '.github/workflows/validate-skills.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: check-translation-freshness.js derives staleness from
          # `git log <source_commit>..HEAD`; in a shallow clone every
          # source_commit is unresolvable so every translation reads as fresh
          # (stale: 0) and the warn step below is vacuously green — see #279/#362.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Pinned to commit SHA for reproducibility — update periodically
      - name: Install skills-ref
        run: |
          pip install "git+https://github.com/agentskills/agentskills.git@752b29a0a1a1#subdirectory=skills-ref"
          skills-ref --version

      - name: Validate all skills
        run: |
          failed=0
          for dir in skills/*/; do
            [ "$(basename "$dir")" = "_template" ] && continue
            if [ -f "$dir/SKILL.md" ]; then
              if ! skills-ref validate "$dir"; then
                failed=1
              fi
            fi
          done
          exit $failed

      # skills-ref validates the agentskills.io frontmatter contract only — it
      # passes a SKILL.md with no Validation, Common Pitfalls, or Related Skills
      # section at all (verified against write-helm-chart, issue #383). The
      # repo's six-section convention needs its own gate.
      - name: Check required sections
        run: node scripts/audit-skill-sections.js --missing

      - name: Check line counts
        run: |
          failed=0
          for f in skills/*/SKILL.md; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 500 ]; then
              echo "FAIL: $f ($lines lines > 500)"
              failed=1
            fi
          done
          exit $failed

      - name: Verify registry count
        run: |
          disk_count=$(find skills -name SKILL.md -not -path "skills/_template/*" | wc -l)
          reg_count=$(grep 'total_skills:' skills/_registry.yml | tr -d '\r' | awk '{print $2}')
          if [ "$disk_count" != "$reg_count" ]; then
            echo "FAIL: disk=$disk_count registry=$reg_count"
            exit 1
          fi
          echo "OK: $disk_count skills on disk match registry"

      - name: Validate translated skills
        run: |
          # Known accepted overruns — translations whose source-fidelity outweighs
          # the 500-line ceiling. Currently none (all translations are within the
          # ceiling). Keep this list short; prefer extracting examples to
          # references/EXAMPLES.md over allowlisting when adding new translations.
          OVERRUN_ALLOWLIST=()

          is_allowed() {
            local path="$1"
            for allowed in "${OVERRUN_ALLOWLIST[@]}"; do
              [ "$path" = "$allowed" ] && return 0
            done
            return 1
          }

          failed=0
          for locale_dir in i18n/*/skills/; do
            [ ! -d "$locale_dir" ] && continue
            locale=$(basename "$(dirname "$locale_dir")")
            for dir in "$locale_dir"/*/; do
              [ ! -f "$dir/SKILL.md" ] && continue
              skill_path="${dir%/}/SKILL.md"
              skill_path="${skill_path//\/\//\/}"
              if ! grep -q "locale: $locale" "$skill_path"; then
                echo "FAIL: $skill_path missing locale: $locale"
                failed=1
              fi
              lines=$(wc -l < "$skill_path")
              if [ "$lines" -gt 500 ]; then
                if is_allowed "$skill_path"; then
                  echo "WARN (allowlisted): $skill_path ($lines lines > 500)"
                else
                  echo "FAIL: $skill_path ($lines > 500)"
                  failed=1
                fi
              fi
            done
          done
          exit $failed

      - name: Install dependencies
        run: npm ci

      - name: Check translation freshness (warn only)
        run: node scripts/check-translation-freshness.js --warn

      # Keep-in-English frontmatter parity (#371, widened by #485). Ships BLOCKING,
      # not warn-only: the corpus is verified clean at introduction — a 39-file
      # catch-up in #371's PR, and an 88-field catch-up across 61 files in #485's —
      # so the promotion precondition is met each time, and a warn stream nobody
      # watches would reproduce the root cause (#371 = two months of silent drift;
      # #485 = four). Deterministic exact comparison, unlike the heuristic
      # warn-only A9. Local `npm run validate:i18n-parity` matches.
      #
      # #485 widened it from allowed-tools alone to every keep-in-English field.
      # `version` is compared on DIRECTION rather than equality: a translation pins
      # the English version it was made from, so all 317 of its divergences lag and
      # are correct — but 0 run ahead, and a translation claiming a version its
      # source never reached can only have authored it, so that case blocks.
      #
      # The step prints a field-comparison count (21,456 today). Read it: a
      # column-anchored implementation compares only the one top-level field and
      # still reports OK, and the count is the only thing that distinguishes the
      # two. NOTE it is printed, not asserted — nothing here fails on a low count,
      # so it is a diagnostic for a human, not a gate. See the follow-up issue.
      - name: Check i18n frontmatter parity
        run: node scripts/check-i18n-frontmatter-parity.js

      # Keep-code-in-English fence parity (#472).
      #
      # Ships WARN-ONLY, unlike the frontmatter gate above, and the difference is
      # the corpus state at introduction. #371 could ship blocking because a
      # 39-file catch-up in the same PR left it clean. This one lands on 1,307
      # violations across 338 files (1,220 in skills, 87 in the agents/teams/
      # guides mirrors), and the repair splits into reviewable batches — 1,014
      # mechanical, 206 in 46 files that are content forks needing
      # re-translation, some of it regulated (#478), 87 in mirrors the normalizer
      # does not yet cover. A blocking gate here would fail every build until the
      # last batch merges.
      #
      # Warn is a temporary state with a named exit: #477 flips this to blocking
      # in the PR that clears the final batch, and the red-to-green transition is
      # the proof the gate can fail. The day-one red output is recorded in the
      # PR that introduced this step, per CLAUDE.md § Proving a Gate Can Fail.
      #
      # The gate needs full history — it accepts a translated fence body that
      # matches ANY revision of its English source, which is what makes it immune
      # to the staleness confound. `fetch-depth: 0` above is therefore
      # load-bearing here too, and the script hard-exits on a shallow clone
      # rather than passing vacuously (#279/#362).
      - name: Check i18n code-fence parity (warn only until #477)
        run: node scripts/check-i18n-fence-parity.js --warn
